<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Internship Assistant</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px}</style><h1>Internship Tracker</h1><input id="api" value="https://internship-assistant-api.onrender.com"><input id="company" placeholder="Company"><input id="role" placeholder="Role"><input id="deadline" placeholder="Deadline"><button onclick="add()">Add application</button><button onclick="load()">Refresh applications</button><pre id="out"></pre><script>async function load(){let r=await fetch(api.value+'/applications');out.textContent=JSON.stringify(await r.json(),null,2)}async function add(){let r=await fetch(api.value+'/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:company.value,role:role.value,deadline:deadline.value||null})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
